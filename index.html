<!DOCTYPE html>
<html lang="ha">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b6b3a">
<title>Beacon - Learn, Stay Healthy, Grow Wealth</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--g:#0b6b3a;--gt:#0b6b3a;--g2:#e6f4ec;--gold:#c8962b;--bg:#f3f6f4;--tx:#15211b;--card:#fff;--mut:#5b6a62;--bd:#d6dfda;--ok:#1e8e4e;--no:#c0392b;--nav:#fff;
--info:#e8f1fb;--infob:#8db5e6;--do:#e6f4ec;--dob:#6fbf8d;--dont:#fff4d6;--dontb:#e5b93c;--dang:#fdecea;--dangb:#e57368}
@media(prefers-color-scheme:dark){:root{--gt:#5fd394;--g2:#1d3226;--bg:#0f1714;--tx:#e8f0ec;--card:#18231e;--mut:#9db0a7;--bd:#2b3a33;--nav:#141e1a;
--info:#17283a;--infob:#35608f;--do:#1b3326;--dob:#2f7a4c;--dont:#3a3217;--dontb:#8a6d1c;--dang:#3b1f1c;--dangb:#8e3b33}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);line-height:1.5;padding-bottom:76px}
body.noav{padding-bottom:16px}
header{position:sticky;top:0;z-index:5;background:var(--g);color:#fff;display:flex;align-items:center;gap:8px;padding:10px 14px}
header h1{font-size:1.1rem;margin:0;flex:1;font-weight:700}
header button{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:10px;font-size:1.1rem;padding:6px 12px;cursor:pointer}
.xp{font-size:.85rem;background:rgba(255,255,255,.18);padding:4px 10px;border-radius:999px;white-space:nowrap}
main{max-width:640px;margin:0 auto;padding:14px 14px 8px}
h2{font-size:1.15rem;margin:18px 0 8px}
h3{font-size:1rem;margin:0 0 6px}
.sub{color:var(--mut);font-size:.9rem;margin:0 0 10px}
.en{display:block;color:var(--mut);font-size:.85em;font-style:italic;margin-top:2px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.btn{display:block;width:100%;background:var(--g);color:#fff;border:0;border-radius:12px;padding:13px;font-size:1rem;font-weight:600;cursor:pointer;margin-top:10px;text-align:center}
.btn.sm{display:inline-block;width:auto;padding:8px 14px;font-size:.9rem;margin-top:0}
.btn2{display:block;width:100%;background:transparent;color:var(--gt);border:1px solid var(--gt);border-radius:12px;padding:11px;font-size:1rem;cursor:pointer;margin-top:8px}
.btn.del,.del{background:transparent;color:var(--no);border:0;cursor:pointer;font-size:1rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:7px 13px;font-size:.92rem;cursor:pointer}
.chip.on{background:var(--g);border-color:var(--g);color:#fff}
.lbl{font-weight:600;margin:12px 0 4px;font-size:.9rem}
input,select{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font-size:1rem}
.row{display:flex;gap:8px}.row>*{flex:1}
.hero{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(135deg,#0b6b3a,#13915a);color:#fff;border-radius:16px;padding:16px;margin-bottom:12px}
.hero h2{margin:0;font-size:1.25rem}.hero p{margin:2px 0 0;opacity:.9;font-size:.9rem}
.streak{text-align:center;font-size:1.5rem;font-weight:800;background:rgba(255,255,255,.18);border-radius:12px;padding:6px 12px}
.streak small{display:block;font-size:.7rem;font-weight:400}
.daily{width:100%;text-align:left;border:0;border-radius:14px;padding:14px;margin-bottom:12px;background:linear-gradient(135deg,#c8962b,#e0b04d);color:#2b1f00;cursor:pointer;display:block}
.daily.done{background:var(--g2);color:var(--tx);border:1px solid var(--bd)}
.daily b{font-size:1.05rem}.daily small{display:block;opacity:.85}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 10px;text-align:left;color:var(--tx);cursor:pointer;display:flex;flex-direction:column;gap:2px}
.tile .ti{font-size:1.7rem}.tile b{font-size:.98rem}.tile small{color:var(--mut);font-size:.8rem}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--nav);border-top:1px solid var(--bd);display:flex;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
body.noav nav{display:none}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:8px 2px 6px;font-size:.72rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}
nav button span{font-size:1.35rem}
nav button.on{color:var(--gt);font-weight:700}
.top{display:flex;justify-content:space-between;font-size:.9rem;color:var(--mut);margin-bottom:6px}
.tm{font-weight:700;color:var(--no)}
.bar{height:8px;background:var(--bd);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--g);border-radius:8px}
.bar.gold i{background:var(--gold)}
.qn{font-size:.82rem;color:var(--mut)}
.q{font-size:1.1rem;font-weight:600;margin:6px 0 10px}
.say{background:var(--g2);color:var(--gt);border:0;border-radius:8px;padding:6px 10px;font-size:.85rem;cursor:pointer;margin-bottom:8px}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-size:1rem;cursor:pointer}
.opt.sel{border-color:var(--g);background:var(--g2)}
.opt.ok{background:#d9f2e3;border-color:var(--ok);color:#0d3b20}
.opt.no{background:#f9dcd8;border-color:var(--no);color:#5a1a13}
.fb{margin-top:10px;padding:12px;border-radius:10px;font-size:.95rem}
.fb.g{background:var(--g2)}.fb.r{background:var(--dang)}
.fb p{margin:6px 0 0}
.pal{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.pal button{width:34px;height:34px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer;font-size:.85rem}
.pal button.a{background:var(--g2);border-color:var(--g)}
.pal button.c{outline:2px solid var(--gold)}
.score{text-align:center;font-size:2.8rem;font-weight:800;color:var(--gt);margin:4px 0}
.center{text-align:center}
.sec{border-radius:12px;padding:12px;margin-bottom:10px;border:1px solid}
.sec.info{background:var(--info);border-color:var(--infob)}
.sec.do{background:var(--do);border-color:var(--dob)}
.sec.dont{background:var(--dont);border-color:var(--dontb)}
.sec.danger{background:var(--dang);border-color:var(--dangb)}
.sec ul{margin:0;padding-left:20px}.sec li{margin:6px 0}
.disc{font-size:.8rem;color:var(--mut);margin-top:12px}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}
.li:last-child{border:0}.li .g{flex:1}
.li small{color:var(--mut);display:block}
.pos{color:var(--ok);font-weight:700}.neg{color:var(--no);font-weight:700}
.big{font-size:1.5rem;font-weight:800}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.bdg{background:var(--g2);border-radius:12px;padding:8px 10px;font-size:.8rem;text-align:center;min-width:92px}
.bdg.off{opacity:.35;filter:grayscale(1)}
.bdg span{display:block;font-size:1.5rem}
table{width:100%;border-collapse:collapse;font-size:.9rem}
td,th{padding:7px 6px;border-bottom:1px solid var(--bd);text-align:left}
tr.me td{background:var(--g2);font-weight:700}
details{border-top:1px solid var(--bd);padding:8px 0}
summary{cursor:pointer;font-weight:600}
.pill{display:inline-block;font-size:.72rem;padding:2px 8px;border-radius:999px;background:var(--g2);color:var(--gt);margin-left:6px}
.pill.od{background:var(--dang);color:var(--no)}.pill.sn{background:var(--dont);color:#8a6d1c}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:12px;font-size:.9rem;z-index:20;max-width:90%;text-align:center}
.foot{text-align:center;color:var(--mut);font-size:.75rem;margin:18px 0 6px}

nav button small{font-size:.6rem;opacity:.85;font-weight:400;line-height:1}
.logo{width:96px;height:96px;border-radius:50%;display:block;margin:0 auto 8px;background:#fff}
.logo.big{width:150px;height:150px}.logo.sm{width:44px;height:44px;margin-bottom:4px;display:inline-block}
a.btn,a.btn2{text-decoration:none}
a.btn{color:#fff}.foot a{color:var(--gt)}

</style>
</head>

[`eng`,`Choose the word opposite in meaning to "ancient".`,[`Old`,`Modern`,`Historic`,`Past`],1,`Ancient yana nufin na da sosai. Akasin sa shi ne modern (na zamani).`,`Ancient means very old. Its opposite is modern.`],

[`eng`,`Musa is the ____ of the two brothers.`,[`tall`,`tallest`,`taller`,`more tall`],2,`Idan ana kwatanta mutum biyu, ana amfani da comparative: taller. Tallest don uku ko fiye.`,`Comparing two people uses the comparative: taller.`],

[`mat`,`Find the perimeter of a square of side 7 cm.`,[`14 cm`,`21 cm`,`28 cm`,`49 cm`],2,`Square yana da gefe 4 daidai. Perimeter = 4 x 7 = 28 cm.`,`Perimeter = 4 x side = 28 cm.`],

[`mat`,`Find the simple interest on ₦1,000 at 10% per annum for 2 years.`,[`₦100`,`₦200`,`₦120`,`₦1,200`],1,`SI = (P x R x T) / 100 = (1000 x 10 x 2) / 100 = ₦200.`,`SI = PRT/100 = (1000 x 10 x 2)/100 = ₦200.`],

[`mat`,`Find the LCM of 4 and 6.`,[`2`,`12`,`24`,`10`],1,`Jerin 4: 4, 8, 12... Jerin 6: 6, 12... Mafi ƙanƙanta da suka haɗu shi ne 12.`,`Multiples of 4: 4, 8, 12; of 6: 6, 12. The smallest common one is 12.`],

[`Ba da ORS bayan kowace bayan gida mai ruwa. Za ka iya yin ORS a gida (duba kayan aikin ORS).`,`Give ORS after every loose stool. You can make ORS at home (see the ORS tool).`],
[`Ba yara zinc na kwana 10 zuwa 14 kamar yadda ma'aikacin lafiya ya shawarta.`,`Give zinc for 10 to 14 days as a health worker advises.`],
[`Wanke hannu da sabulu bayan bayan gida da kafin cin abinci.`,`Wash hands with soap after the toilet and before eating.`]]},
{k:`dont`,h:[`Abin da bai kamata ka yi ba`,`What to avoid`],i:[

[`Kada ka daina ba da ruwa ko abinci.`,`Do not stop fluids or food.`]]},
{k:`danger`,h:[`Je asibiti nan take idan:`,`Go to hospital now if:`],i:[

{id:`child`,ic:`👶`,ha:`Kula da jariri da yaro`,en:`Baby and child care`,tools:[`vax`],secs:[

[`Ka shayar da jariri nono kaɗai har wata 6. Kada ka ba shi ruwa, kunu ko komai.`,`Exclusive breastfeeding for the first 6 months. No water, pap or other foods.`],
[`Daga wata 6, ka fara ba da abinci mai gina jiki tare da nono har shekara 2.`,`From 6 months add nutritious foods and keep breastfeeding up to 2 years.`]]},

[`Ka auna girman yaro a asibiti akai-akai, kuma ka karɓi Vitamin A idan ana rabawa.`,`Have the child weighed regularly at the clinic and take Vitamin A when offered.`],
[`Idan yaro yana da zazzaɓi: sa masa tufafi masu sauƙi, ba shi ruwa ko nono, kuma ka kai shi a gwada shi. Paracetamol kawai bisa adadin da ma'aikacin lafiya ko takardar magani suka nuna.`,`For fever: light clothing, plenty of fluids or breast milk, and get the child tested. Paracetamol only at the dose a health worker or the label shows.`]]},
{k:`dont`,h:[`Abin da bai kamata ka yi ba`,`What to avoid`],i:[

{id:`firstaid`,ic:`🩹`,ha:`Agajin gaggawa`,en:`First aid`,tools:[],secs:[
{k:`do`,h:[`Zubar jini`,`Bleeding`],i:[
[`Danna wurin da ƙarfi da kyalle mai tsabta. Ɗaga wurin sama.`,`Press firmly with a clean cloth. Raise the limb.`],
[`Idan kyallen ya jiƙe da jini, ƙara wani a kai, kada ka cire na farko. Je asibiti idan jinin yana yawa.`,`If it soaks through, add more cloth on top; don't remove the first. Go to hospital if bleeding is heavy.`]]},
{k:`do`,h:[`Konewa`,`Burns`],i:[
[`Zuba ruwan famfo mai sanyi a wurin na minti 20. Cire zobe ko abu mai matsewa kafin ya kumbura.`,`Cool under clean running water for 20 minutes. Remove rings or tight items before swelling.`],
[`Rufe da kyalle mai tsabta a hankali. Kada ka shafa man shafawa, man gyaɗa, man goge baki ko ƙanƙara. Kada ka fasa kumburi.`,`Cover loosely with a clean cloth. Don't apply toothpaste, butter, oil or ice. Don't pop blisters.`],
[`Je asibiti idan konewar tana da girma, a fuska, hannu, ƙafa, al'aura, ko a yaro.`,`Go to hospital if the burn is large, on the face, hands, feet or genitals, or on a child.`]]},
{k:`danger`,h:[`Cizon maciji`,`Snake bite`],i:[
[`Ka kwantar da hankali. Ka riƙe wurin a natse, kar ya motsa sosai. Cire zobe ko agogo.`,`Stay calm. Keep the limb still. Remove rings and watches.`],
[`Kai shi asibiti nan take; maganin cizon maciji yana asibiti.`,`Get to a hospital immediately; antivenom is given there.`],
[`Kada ka yanka wurin, kada ka tsotsa, kada ka ɗaure shi da ƙarfi, kuma kada ka shafa magani na gargajiya.`,`Do not cut, suck, tie tightly, or apply herbs.`]]},
{k:`do`,h:[`Shaƙewa`,`Choking`],i:[
[`Ka ce wa mutum ya yi tari. Idan ya kasa tari ko magana: buga masa baya sau 5 tsakanin ƙashin kafaɗa.`,`Encourage coughing. If he cannot cough or speak: 5 firm back blows between the shoulder blades.`],
[`Idan bai fita ba: matsa ciki sau 5 (abdominal thrusts). Jariri: buga baya sau 5, sannan matsa ƙirji da yatsu biyu sau 5.`,`If still stuck: 5 abdominal thrusts. For a baby: 5 back blows then 5 chest thrusts with two fingers.`]]},
{k:`do`,h:[`Farfaɗiya ko girgizar jiki`,`Seizure or convulsion`],i:[
[`Ka kwantar da shi a gefe a wuri mai laushi, ka cire abubuwa masu cutarwa kusa da shi.`,`Lay him on his side on a soft area and clear dangerous objects.`],
[`Kada ka sa komai a bakinsa. Ka kula da lokaci. Kira taimako idan ya wuce minti 5 ko shi ne karo na farko.`,`Put nothing in his mouth. Note the time. Get help if it lasts over 5 minutes or it is the first time.`]]},
{k:`danger`,h:[`Shan fetur, kananzir ko guba`,`Swallowed kerosene or poison`],i:[
[`Kada ka sa shi ya yi amai. Kada ka ba shi madara ko wani abu.`,`Do not make him vomit. Do not give milk or other drinks.`],
[`Kai shi asibiti nan take kuma ka tafi da kwalbar abin da ya sha.`,`Go to hospital immediately and take the container with you.`]]},
{k:`do`,h:[`Suma`,`Fainting`],i:[
[`Kwantar da shi, ɗaga ƙafafunsa sama, sassauta tufafi. Idan bai farfaɗo cikin minti 1 ba, nemi taimako.`,`Lay him down, raise the legs, loosen clothes. If he does not recover within 1 minute, get help.`]]},
{k:`danger`,h:[`Lambar gaggawa`,`Emergency number`],i:[
[`Kira 112 a Najeriya. Ka faɗi inda kake da abin da ya faru.`,`Call 112 in Nigeria. Say where you are and what happened.`]]}
]},

{id:`nutrition`,ic:`🥗`,ha:`Abinci mai gina jiki`,en:`Healthy eating`,tools:[],secs:[
{k:`info`,h:[`Abin da ya kamata ka sani`,`What to know`],i:[
[`Kowane abinci ya kamata ya haɗa: abinci mai kuzari (tuwo, shinkafa, gero, dawa), mai gina jiki (wake, ƙwai, nama, kifi, madara), da kayan lambu da 'ya'yan itace.`,`Each meal should mix energy foods (tuwo, rice, millet, sorghum), body-building foods (beans, eggs, meat, fish, milk), and vegetables and fruit.`],
[`Abinci masu iron: hanta, wake, ganye kore. Masu Vitamin A: karas, mangwaro, gwanda, jan mai.`,`Iron-rich: liver, beans, dark green leaves. Vitamin A: carrots, mango, pawpaw, red palm oil.`],
[`Yi amfani da gishiri mai iodine.`,`Use iodised salt.`]]},
{k:`do`,h:[`Abin da za ka yi`,`What to do`],i:[
[`Sha ruwa sosai, ka rage abin sha mai zaki da gishiri ko mai da yawa.`,`Drink plenty of water; cut down on sugary drinks and too much salt or oil.`],
[`Ka auna damtsen yaro (MUAC) a asibiti. Idan ya yi ƙasa da 11.5 cm, yaro yana da tamowa mai tsanani.`,`Measure a child's mid-upper arm (MUAC) at the clinic. Below 11.5 cm means severe acute malnutrition.`]]},
{k:`danger`,h:[`Je cibiyar lafiya idan:`,`See a health centre if:`],i:[
[`Yaro ya kumbura ƙafafu, ya rame sosai, ko gashinsa ya canza launi.`,`A child has swollen feet, severe wasting, or changed hair colour.`]]}
]},

{id:`ncd`,ic:`🩺`,ha:`Hawan jini da ciwon sukari`,en:`Blood pressure and diabetes`,tools:[`bmi`],secs:[
{k:`info`,h:[`Abin da ya kamata ka sani`,`What to know`],i:[
[`Hawan jini sau da yawa ba ya da alama. A auna jini akai-akai, musamman bayan shekaru 30.`,`High blood pressure often has no signs. Check regularly, especially after age 30.`],
[`Alamomin ciwon sukari: fitsari akai-akai, ƙishirwa, rama, gajiya, da raunuka masu jinkirin warkewa.`,`Diabetes signs: frequent urination, thirst, weight loss, tiredness, slow-healing wounds.`]]},
{k:`do`,h:[`Abin da za ka yi`,`What to do`],i:[
[`Rage gishiri da mai, ka ci kayan lambu, ka yi motsa jiki (tafiya ta mintuna 30 a rana), ka guji taba.`,`Cut salt and oil, eat vegetables, exercise (30 minutes of walking a day), avoid tobacco.`],
[`Idan karatun jininka ya kai 140/90 ko sama sau fiye da ɗaya, ka ga likita.`,`If your reading is 140/90 or higher more than once, see a doctor.`]]},
{k:`danger`,h:[`Shanyewar jiki (stroke): je asibiti nan take`,`Stroke (act FAST): go now`],i:[

]}

/* ---------- random helpers ---------- */
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}
function shuffled(a,r){r=r||Math.random;a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));const t=a[i];a[i]=a[j];a[j]=t}return a}

/* ---------- quiz engine ---------- */
let run=null;
const fmt=t=>{t=Math.max(0,t);const m=Math.floor(t/60),s=t%60;return m+':'+pad(s)};
function startQuiz(mode,list,time){
  if(!list.length){toast(U('Babu tambayoyi.','No questions.'));return}
  run={mode,list,i:0,ans:list.map(()=>null),done:false,time:time||0,t0:time||0,tid:null,earn:0,bonus:0};
  if(time){run.tid=setInterval(()=>{if(!run||run.done)return;run.time--;updTimer();if(run.time<=0)finishQuiz()},1000)}
  if(location.hash==='#quiz')route();else go('quiz');
}
function startPractice(){
  const pool=QS.filter(q=>P.sub==='all'||q.s===P.sub);
  startQuiz('practice',shuffled(pool).slice(0,Math.min(P.n,pool.length)).map(q=>prep(q)));
}
function startExam(){
  let list=[];Object.keys(SUBJ).filter(k=>X.subs[k]).forEach(k=>{list=list.concat(shuffled(QS.filter(q=>q.s===k)).slice(0,X.n).map(q=>prep(q)))});
  startQuiz('exam',list,list.length*(S.set.exam==='JAMB'?40:60));
}
function startDaily(){
  const r=rng(hash(today()));
  startQuiz('daily',shuffled(QS,r).slice(0,5).map(q=>prep(q,r)));
}
function startReview(){
  const list=S.wrong.map(id=>QBY[id]).filter(Boolean);
  if(!list.length){toast(U('Babu kuskure da aka ajiye. Yi atisaye tukuna.','No saved mistakes yet. Practise first.'));return}
  startQuiz('review',shuffled(list).slice(0,20).map(q=>prep(q)));
}
function quitQuiz(){if(run&&!run.done&&!confirm(U('Ka fita? Za a rasa wannan atisayen.','Quit? This quiz will be lost.')))return;if(run)clearInterval(run.tid);run=null;go('school')}
function updTimer(){const el=$('#tm');if(el&&run)el.textContent='⏱ '+fmt(run.time)}
function say(){try{const x=run.list[run.i];const u=new SpeechSynthesisUtterance(x.q+'. '+x.o.map((t,i)=>'ABCD'[i]+'. '+t).join('. '));u.lang='en-NG';speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function pick(k){
  if(!run||run.done)return;
  if(run.mode!=='exam'&&run.ans[run.i]!==null)return;
  run.ans[run.i]=k;route(true);
}
const nav=d=>{run.i=Math.max(0,Math.min(run.list.length-1,run.i+d));try{speechSynthesis.cancel()}catch(e){}route()};
const jump=i=>{run.i=i;route()};
function submitExam(){
  const un=run.ans.filter(x=>x===null).length;
  if(un&&!confirm(U(`Ba ka amsa tambayoyi ${un} ba. Ka ƙare?`,`${un} unanswered. Submit anyway?`)))return;
  finishQuiz();
}

function finishQuiz(){
  if(!run||run.done)return;
  clearInterval(run.tid);run.done=true;
  const n=run.list.length;let sc=0;const per={};
  run.list.forEach((q,i)=>{
    const a=run.ans[i];if(a===null&&run.mode!=='exam')return;
    const ok=a===q.a;if(ok)sc++;
    const st=S.stats[q.s]=S.stats[q.s]||{c:0,t:0};st.t++;if(ok)st.c++;
    per[q.s]=per[q.s]||{c:0,t:0};per[q.s].t++;if(ok)per[q.s].c++;
    const w=S.wrong.indexOf(q.id);
    if(ok&&w>=0)S.wrong.splice(w,1);
    if(!ok&&w<0)S.wrong.push(q.id);
  });
  run.sc=sc;run.per=per;
  const mult=run.mode==='exam'?8:5;
  run.earn=sc*mult;
  if(run.mode==='daily'&&!dailyDone()&&sc>=3){run.bonus=20;S.daily=today()}
  addXP(run.earn+run.bonus);
  touchStreak();
  award('first');
  if(n>=10&&sc/n>=0.9)award('ace');
  if(S.streak>=3)award('s3');
  if(S.streak>=7)award('s7');
  save();route();
}
function resultView(){

function calcAdashe(){
  const n=Math.round(num('an')),a=num('aa'),f=+val('af'),s=val('as'),m=Math.round(num('am'));
  if(!(n>=2&&a>0&&s)){toast(U('Cika duk bayanai.','Fill all fields.'));return}
  const pot=n*a;let rows='';const st=parseD(s);
  for(let i=1;i<=n;i++){rows+=`<tr class="${i===m?'me':''}"><td>${i}</td><td>${fmtD(addDays(st,(i-1)*f))}</td><td>${naira(pot)}</td></tr>`}
  $('#out').innerHTML=`<div class="sec do" style="margin-top:12px">${U('Kowane zagaye kana biyan','Each round you pay')} <b>${naira(a)}</b><br>${U('Jimillar da za ka biya','Total you pay')}: <b>${naira(pot)}</b><br>${m>=1&&m<=n?`${U('Za ka karɓi','You receive')} <b>${naira(pot)}</b> ${U('a zagaye na','in round')} ${m} (${fmtD(addDays(st,(m-1)*f))})`:''}</div>
  <table><tr><th>#</th><th>${U('Rana','Date')}</th><th>${U('Wanda zai karɓa','Payout')}</th></tr>${rows}</table>`;
}

  return{t:'🕌 '+U('Ƙididdigar zakka','Zakat calculator'),h:`<div class="card">

function calcZakat(){
  const g=id=>{const v=num(id);return isNaN(v)?0:v};
  const net=g('z1')+g('z2')+g('z3')-g('z4'),nis=g('z5');
  if(!(nis>0)){toast(U('Shigar da ƙimar nisabi.','Enter the nisab value.'));return}
  $('#out').innerHTML=net>=nis?`<div class="sec do" style="margin-top:12px">${U('Dukiyar da ta rage','Net wealth')}: <b>${naira(net)}</b><br>${U('Zakka (2.5%)','Zakat due (2.5%)')}: <div class="big">${naira(net*0.025)}</div></div>`:`<div class="sec info" style="margin-top:12px">${U('Dukiyarka','Your net wealth')} (${naira(net)}) ${U('ba ta kai nisabi ba, don haka zakka ba ta wajaba.','is below nisab, so zakat is not due.')}</div>`;

function loanView(){
  return{t:'🏦 '+U('Ainihin kuɗin bashi','True cost of a loan'),h:`<div class="card">
  <div class="row"><div><div class="lbl">${U('Bashin da aka karɓa (₦)','Amount borrowed (₦)')}</div><input id="lp" type="number" inputmode="decimal"></div><div><div class="lbl">${U('Riba a wata (%)','Interest per month (%)')}</div><input id="lr" type="number" inputmode="decimal" step="0.1"></div></div>
  <div class="lbl">${U('Tsawon lokaci (watanni)','Duration (months)')}</div><input id="lm" type="number" inputmode="numeric">
  <button class="btn" onclick="calcLoan()">${U('Ƙididdige','Calculate')}</button><div id="out"></div></div>
  <p class="disc">${U('Ana ƙididdige riba ne a kan jimillar bashi (flat) kowane wata. Ainihin riba ta shekara (APR) tana nuna cikakken tsadar bashin.','Interest is calculated flat on the original amount each month. The effective APR shows the real yearly cost of the loan.')}</p>`};
}
function calcLoan(){
  const P0=num('lp'),r=num('lr')/100,m=Math.round(num('lm'));
  if(!(P0>0&&r>=0&&m>=1)){toast(U('Cika duk bayanai.','Fill all fields.'));return}
  const intr=P0*r*m,tot=P0+intr,pm=tot/m;
  let lo=0,hi=5;for(let i=0;i<100;i++){const mid=(lo+hi)/2;const pv=mid===0?pm*m:pm*(1-Math.pow(1+mid,-m))/mid;if(pv>P0)lo=mid;else hi=mid}
  const apr=lo*12*100;
  $('#out').innerHTML=`<div class="sec ${apr>60?'danger':apr>30?'dont':'do'}" style="margin-top:12px">${U('Riba','Interest')}: <b>${naira(intr)}</b><br>${U('Jimilla da za ka mayar','Total to repay')}: <b>${naira(tot)}</b><br>${U('A kowane wata','Per month')}: <b>${naira(pm)}</b><br>${U('Ainihin APR','Effective APR')}: <div class="big">${apr.toFixed(0)}%</div>${apr>60?U('Wannan bashi ne mai tsada sosai. Ka yi tunani sau biyu.','This is a very expensive loan. Think twice.'):''}</div>`;
}

function addPrice(){const i=val('pi'),p=num('pp');if(!i||!(p>0)){toast(U('Cika kaya da farashi.','Enter item and price.'));return}S.prices.push({id:Date.now(),i,p,u:val('pu'),m:val('pm'),d:today()});save();route(true)}
